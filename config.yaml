# Configuração do my-aide. Valores locais/sensíveis vão em config.local.yaml,
# que sobrepõe este arquivo e é ignorado pelo git.

timezone: America/Sao_Paulo
locale: pt-BR
user_name: Wyllgner

llm:
  provider: openai
  # modelo forte: conversa e planejamento
  model_chat: gpt-5.6-luna
  # modelo barato: rotina, classificação, parsing de data, briefings
  model_fast: gpt-5-nano
  temperature: 0.3
  max_output_tokens: 1200
  timeout_seconds: 60
  max_retries: 3

context:
  # orçamento de contexto montado pelo orquestrador
  token_budget: 8000
  # quantas mensagens da sessão entram no prompt
  history_messages: 12

paths:
  data_dir: data
  vault_dir: vault

notify:
  # canais usados pelo scheduler: desktop, console
  channels: [desktop]

schedule:
  briefing_manha: "07:30"
  briefing_noite: "21:30"
  revisao_semanal: "domingo 19:00"
  # de quanto em quanto tempo as regras de condição rodam
  regras_a_cada_horas: 12
