[project]
name = "my-aide"
version = "0.1.0"
description = "Assessor pessoal local: lembra, organiza e cobra."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "mcp>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "pip-audit>=2.7",
       "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
myaide = "aide.cli:app"
myaide-mcp = "aide.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aide*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# datas fixas em teste não precisam de fuso
"tests/*" = ["DTZ001"]

[tool.pytest.ini_options]
markers = ["slow: sobe processo de verdade; mais lento"]
